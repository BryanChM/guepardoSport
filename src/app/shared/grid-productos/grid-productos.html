@if (!cargando && !error) {
  <div class="grid grid-cols-2 sm:grid-cols-2 lg:grid-cols-4 gap-x-6 gap-y-12">
    @for (prenda of prendas; track prenda.id) {
      <div class="group flex flex-col">

        <!-- Imagen con fondo oscuro -->
        <div class="relative overflow-hidden bg-zinc-900 rounded-lg border border-zinc-800" style="aspect-ratio: 3/4;">
          <a [routerLink]="['/producto', prenda.id]" class="block w-full h-full">
            <div class="absolute inset-0 bg-cover bg-center transition-transform duration-700 group-hover:scale-105"
                 [style.backgroundImage]="'url(' + imagenPrincipal(prenda) + ')'">
            </div>
          </a>

          <!-- Badge "Nuevo" (Blanco puro para resaltar) -->
          <div class="absolute top-3 left-3 z-10">
            <span class="bg-white text-black text-[10px] font-bold px-2.5 py-1 uppercase tracking-widest rounded-sm shadow-lg">
              Nuevo
            </span>
          </div>

          <!-- Favorito (Translúcido oscuro) -->
          <button class="absolute top-3 right-3 z-10 w-9 h-9 bg-zinc-950/70 backdrop-blur-md border border-zinc-700 hover:bg-white hover:border-white rounded-full flex items-center justify-center transition-all group/fav">
            <span class="material-symbols-outlined text-[18px] text-white group-hover/fav:text-black">favorite_border</span>
          </button>
        </div>

        <!-- Info del producto (Texto blanco) -->
        <a [routerLink]="['/producto', prenda.id]" class="flex flex-col mt-4 gap-1">
          <h3 class="text-white font-bold text-[14px] leading-snug group-hover:text-zinc-300 transition-colors uppercase tracking-wide">
            {{ prenda.nombre }}
          </h3>
          <p class="text-zinc-500 text-[12px] uppercase tracking-widest">
            {{ prenda.genero === 'MASCULINO' ? 'Hombre' : prenda.genero === 'FEMENINO' ? 'Mujer' : 'Unisex' }}
          </p>
          <p class="text-white font-bold text-[16px] mt-1 font-mono">Q{{ prenda.precioConIva.toFixed(2) }}</p>
        </a>
      </div>
    }
  </div>
}
