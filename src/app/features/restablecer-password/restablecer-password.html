<div class="login-container">
  <form class="login-card" (ngSubmit)="onSubmit()">
    <span class="mancha mancha--brand" aria-hidden="true"></span>
    <h1>Nueva contraseña</h1>

    @if (exito()) {
      <p class="mensaje-exito">¡Listo! Redirigiendo al inicio de sesión...</p>
    } @else {
      <label>Nueva contraseña <input type="password" name="nuevaPassword" [(ngModel)]="nuevaPassword" required /></label>
      <label>Confirmar contraseña <input type="password" name="confirmarPassword" [(ngModel)]="confirmarPassword" required /></label>

      @if (error()) { <p class="error">{{ error() }}</p> }

      <button type="submit" [disabled]="enviando()">{{ enviando() ? 'Guardando...' : 'Guardar nueva contraseña' }}</button>
    }
  </form>
</div>
