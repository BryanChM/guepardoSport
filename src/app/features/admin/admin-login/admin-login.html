<div class="login-container">
  <form class="login-card" (ngSubmit)="onSubmit()">
    <span class="mancha mancha--brand" aria-hidden="true"></span>
    <h1>Panel de Administración</h1>
    <p class="subtitulo">Guepardo Sport</p>

    <label>
      Correo
      <input type="email" name="correo" [(ngModel)]="correo" required autocomplete="username" />
    </label>

    <label>
      Contraseña
      <input type="password" name="password" [(ngModel)]="password" required autocomplete="current-password" />
    </label>

    @if (error()) {
      <p class="error">{{ error() }}</p>
    }

    <button type="submit" [disabled]="cargando()">
      {{ cargando() ? 'Ingresando...' : 'Ingresar' }}
    </button>
  </form>
</div>
