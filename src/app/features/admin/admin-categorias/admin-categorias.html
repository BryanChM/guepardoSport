<app-admin-nav></app-admin-nav>

<div class="admin-header"><h1>Categorías</h1></div>

<section class="tarjeta-form">
  <h2>Nueva categoría</h2>
  <div class="fila-form" style="grid-template-columns: 1fr auto;">
    <input type="text" [(ngModel)]="nuevoNombre" placeholder="Ej. Ciclismo" />
    <button class="btn-primario" (click)="agregar()">Agregar</button>
  </div>
</section>

<table class="tabla">
  <thead><tr><th>Nombre</th><th></th></tr></thead>
  <tbody>
    @for (c of categorias(); track c.id) {
      <tr>
        @if (editandoId === c.id) {
          <td><input type="text" [(ngModel)]="nombreEdicion" /></td>
          <td class="acciones">
            <button (click)="guardar(c.id)">Guardar</button>
            <button (click)="editandoId = null">Cancelar</button>
          </td>
        } @else {
          <td>{{ c.nombre }}</td>
          <td class="acciones">
            <button (click)="editar(c)">Editar</button>
            <button class="peligro" (click)="eliminar(c.id, c.nombre)">Eliminar</button>
          </td>
        }
      </tr>
    }
  </tbody>
</table>
