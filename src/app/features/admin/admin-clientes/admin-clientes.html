<app-admin-nav></app-admin-nav>

<div class="admin-header">
  <h1>Clientes</h1>
</div>

@if (cargando()) { <p class="estado">Cargando...</p> }

<table class="tabla" *ngIf="!cargando()">
  <thead>
  <tr><th>Nombre</th><th>Correo</th><th></th></tr>
  </thead>
  <tbody>
    @for (c of clientes(); track c.id) {
      <tr>
        @if (editandoId === c.id) {
          <td><input type="text" [(ngModel)]="formEdicion.nombre" /></td>
          <td><input type="email" [(ngModel)]="formEdicion.correo" /></td>
          <td class="acciones">
            <button (click)="guardar(c.id)">Guardar</button>
            <button (click)="cancelar()">Cancelar</button>
          </td>
        } @else {
          <td>{{ c.nombre }}</td>
          <td>{{ c.correo }}</td>
          <td class="acciones">
            <button (click)="editar(c)">Editar</button>
            <button class="peligro" (click)="eliminar(c.id, c.nombre)">Eliminar</button>
          </td>
        }
      </tr>
    }
  </tbody>
</table>

@if (!cargando() && clientes().length === 0) { <p class="estado">No hay clientes registrados.</p> }
