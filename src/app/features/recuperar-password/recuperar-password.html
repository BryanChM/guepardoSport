<div class="login-container">
  <form class="login-card" (ngSubmit)="onSubmit()">
    <span class="mancha mancha--brand" aria-hidden="true"></span>
    <h1>Recuperar contraseña</h1>
    <p class="subtitulo">Te enviaremos un enlace a tu correo</p>

    @if (mensaje()) {
      <p class="mensaje-exito">{{ mensaje() }}</p>
    } @else {
      <label>Correo <input type="email" name="correo" [(ngModel)]="correo" required /></label>
      <button type="submit" [disabled]="enviando()">{{ enviando() ? 'Enviando...' : 'Enviar enlace' }}</button>
    }

    <a routerLink="/login" class="link-secundario">Volver a iniciar sesión</a>
  </form>
</div>
